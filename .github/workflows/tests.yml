name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install radon ruff
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Check PEP 8 and naming
        run: ruff check --select E,F,N --line-length 79 src tests
      - name: Check cyclomatic complexity
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.check_output(
              ["radon", "cc", "-j", "src/depviz"], text=True
          )
          modules = json.loads(result)
          violations = [
              (path, item["name"], item["complexity"])
              for path, items in modules.items()
              for item in items
              if item["complexity"] > 10
          ]
          for path, name, complexity in violations:
              print(f"{path}: {name} has complexity {complexity}")
          sys.exit(bool(violations))
          PY
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
